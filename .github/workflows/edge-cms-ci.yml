name: edge-cms CI

on:
  pull_request:
    branches: [main]
    paths: [edge-cms/**]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
      terraform: ${{ steps.filter.outputs.terraform }}
      vcl: ${{ steps.filter.outputs.vcl }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'edge-cms/rust/**'
              - 'edge-cms/shared/**'
            go:
              - 'edge-cms/go/**'
              - 'edge-cms/shared/**'
            typescript:
              - 'edge-cms/typescript/**'
              - 'edge-cms/shared/**'
            terraform:
              - 'edge-cms/terraform/**'
            vcl:
              - 'edge-cms/**/*.vcl'

  rust-checks:
    name: Rust (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edge-cms/rust/target
          key: rust-${{ hashFiles('edge-cms/rust/Cargo.lock') }}
          restore-keys: rust-

      - run: cargo fmt -- --check
      - run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - run: cargo test

  go-checks:
    name: Go (vet + test)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: edge-cms/go/go.sum

      - run: cp -r ../shared ./shared
      - run: go vet ./...
      - run: go test -v ./...

  terraform-checks:
    name: Terraform (fmt + validate)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  typescript-checks:
    name: TypeScript (tsc + build)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge-cms/typescript/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx webpack

  integration-tests-rust:
    name: Integration — Rust (Viceroy)
    needs: [changes, rust-checks]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/rust
    steps:
      - uses: actions/checkout@v4

      - uses: fastly/compute-actions/setup@v6

      - run: rustup target add wasm32-wasip1

      - name: Build Compute package
        run: fastly compute build

      - name: Start Viceroy and run tests
        run: |
          fastly compute serve &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:7676/ > /dev/null 2>&1 && break
            sleep 1
          done
          ./tests/integration.sh

  integration-tests-go:
    name: Integration — Go (Viceroy)
    needs: [changes, go-checks]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/go
    steps:
      - uses: actions/checkout@v4

      - uses: fastly/compute-actions/setup@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: edge-cms/go/go.sum

      - name: Build Compute package
        run: make build

      - name: Start Viceroy and run tests
        run: |
          fastly compute serve &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:7676/ > /dev/null 2>&1 && break
            sleep 1
          done
          ../rust/tests/integration.sh

  integration-tests-typescript:
    name: Integration — TypeScript (Viceroy)
    needs: [changes, typescript-checks]
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-cms/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: fastly/compute-actions/setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge-cms/typescript/package-lock.json

      - run: npm ci

      - name: Build Compute package
        run: fastly compute build

      - name: Start Viceroy and run tests
        run: |
          fastly compute serve &
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:7676/ > /dev/null 2>&1 && break
            sleep 1
          done
          ../rust/tests/integration.sh

  vcl-checks:
    name: VCL (falco fmt + lint)
    needs: changes
    if: needs.changes.outputs.vcl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install falco
        run: |
          curl -sL "https://github.com/ysugimoto/falco/releases/latest/download/falco-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin --strip-components=0

      - name: falco fmt --check
        run: find edge-cms -name '*.vcl' -exec falco fmt --check {} +

      - name: falco lint
        run: find edge-cms -name '*.vcl' -exec falco lint {} +

  detect-secrets:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install detect-secrets==1.5.0
      - run: detect-secrets scan --baseline .secrets.baseline
