[package]
name = "edge-cms"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fastly = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
handlebars = "5"
pulldown-cmark = "0.10"
bcrypt = "0.15"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
ammonia = "4.2.4"
getrandom = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
