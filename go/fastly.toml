manifest_version = 3
name = "edge-cms-go"
language = "go"
description = "Edge CMS — Go implementation"

[scripts]
build = "rm -rf shared && cp -r ../shared ./shared && GOARCH=wasm GOOS=wasip1 go build -o bin/main.wasm ."

[local_server]
  [local_server.kv_stores]
    [local_server.kv_stores.content]
      file = "tests/kv-content.json"
      format = "json"
  [local_server.config_stores]
    [local_server.config_stores.cache_config]
      file = "tests/cache-config.json"
      format = "json"
  [local_server.secret_stores]
    [local_server.secret_stores.secrets]
      file = "tests/secrets.json"
      format = "json"

[setup]
  [setup.kv_stores]
    [setup.kv_stores.content]
  [setup.secret_stores]
    [setup.secret_stores.secrets]
