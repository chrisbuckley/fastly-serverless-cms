repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: forbid-env-files
        name: Block .env files from being committed
        entry: .hooks/forbid-env-files.sh
        language: script
        types: [file]

      - id: forbid-service-versions
        name: Check for hardcoded Fastly service version numbers
        entry: .hooks/forbid-service-versions.sh
        language: script
        types: [file]
        verbose: true

      # ── Terraform ────────────────────────────────────────────────────────
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false

      # ── VCL (falco) ──────────────────────────────────────────────────────
      # VCL lives inline in terraform/vcl.tf. scripts/lint-vcl.sh extracts each
      # snippet, wraps it in its subroutine and runs `falco lint` (same as CI).
      # The standalone .vcl hooks cover any future templatefile()-loaded files.
      - id: falco-lint-terraform-snippets
        name: falco lint (terraform/vcl.tf snippets)
        entry: scripts/lint-vcl.sh terraform/vcl.tf
        language: script
        files: ^terraform/vcl\.tf$|^scripts/(extract|lint)-vcl\.sh$
        pass_filenames: false

      - id: falco-fmt
        name: falco fmt
        entry: falco fmt --check
        language: system
        files: \.vcl$

      - id: falco-lint
        name: falco lint
        entry: falco lint
        language: system
        files: \.vcl$

      # ── Rust ─────────────────────────────────────────────────────────────
      # clippy lints for wasm32-wasip1 (the Compute target, same as CI).
      # Unit tests run on the native host target — the fastly crate compiles
      # natively, so `cargo test` needs no wasm runner (CI does the same).
      - id: rust-fmt
        name: cargo fmt (rust)
        entry: bash -c 'cd rust && cargo fmt -- --check'
        language: system
        files: ^rust/.*\.(rs|toml)$
        pass_filenames: false

      - id: rust-clippy
        name: cargo clippy (rust, wasm32-wasip1)
        entry: bash -c 'cd rust && cargo clippy --quiet --target wasm32-wasip1 -- -D warnings'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false

      - id: rust-test
        name: cargo test (rust, native)
        entry: bash -c 'cd rust && cargo test --quiet'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
        stages: [pre-push]

      # ── Go ───────────────────────────────────────────────────────────────
      # `make copy-shared` stages ../shared into go/shared (untracked) so the
      # embedded templates/assets resolve for vet, same as `make test`.
      - id: go-fmt
        name: gofmt (go)
        entry: bash -c 'test -z "$(gofmt -l go)" || { gofmt -l go; exit 1; }'
        language: system
        files: ^go/.*\.go$
        pass_filenames: false

      - id: go-vet
        name: go vet (go, via make)
        entry: bash -c 'make -C go copy-shared >/dev/null && cd go && go vet ./...'
        language: system
        files: ^(go|shared)/.*
        pass_filenames: false

      # ── TypeScript ───────────────────────────────────────────────────────
      - id: ts-check
        name: tsc --noEmit (typescript)
        entry: bash -c 'cd typescript && npx tsc --noEmit'
        language: system
        files: ^typescript/.*\.ts$
        pass_filenames: false

      # ── Repo scripts ─────────────────────────────────────────────────────
      - id: shellcheck-scripts
        name: shellcheck (scripts, hooks, integration suite)
        entry: shellcheck
        language: system
        files: ^(scripts/.*\.sh|\.hooks/.*\.sh|rust/tests/integration\.sh)$

      - id: test-forbid-env-files
        name: test .hooks/forbid-env-files.sh
        entry: scripts/test-forbid-env-files.sh
        language: script
        files: ^(\.hooks/forbid-env-files\.sh|scripts/test-forbid-env-files\.sh)$
        pass_filenames: false
